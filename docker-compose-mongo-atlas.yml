services:
  mongodb_atlas:
    container_name: mongodb-atlas
    image: mongodb/mongodb-atlas-local
    hostname: mongodb-atlas # Add the following line in etc/hosts file: 127.0.0.1 mongodb-atlas
    ports:
      - 27017:27017
    volumes:
      - mongo-db:/data/db
      - mongo-t:/data/mongot
      - mongo-config:/data/configdb

volumes:
  mongo-db: {}
  mongo-t: {}
  mongo-config: {}
